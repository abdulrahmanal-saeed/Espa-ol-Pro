name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, content, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/core/db/database.g.dart
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test tool test_screenshots
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Content validation
        run: dart run tool/validate_content.dart
      - name: Unit and widget tests
        run: flutter test
      - name: No secrets committed
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36})' -- . ':!pubspec.lock'; then
            echo "Possible secret found"; exit 1
          fi

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      # The NDK download on hosted runners occasionally arrives corrupt
      # ("Error reading Zip content"), which fails the Gradle build for
      # reasons unrelated to the code. Install the exact NDK Flutter asks
      # for up front, verify it, and retry a corrupt download.
      - name: Install Android NDK (verified, with retry)
        run: |
          NDK="$(grep -oE 'ndkVersion: String = "[0-9.]+"' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" \
            | grep -oE '[0-9]+(\.[0-9]+)+')"
          test -n "$NDK" || { echo "Could not read Flutter's NDK version"; exit 1; }
          echo "Flutter requires NDK $NDK"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            if "$SDKMANAGER" --install "ndk;$NDK" \
               && test -f "$ANDROID_HOME/ndk/$NDK/source.properties"; then
              echo "NDK $NDK installed on attempt $attempt"
              exit 0
            fi
            echo "NDK install attempt $attempt failed; removing partial install"
            rm -rf "$ANDROID_HOME/ndk/$NDK"
            sleep 20
          done
          echo "NDK $NDK could not be installed after 4 attempts"
          exit 1
      # compileSdk 37 (see android/app/build.gradle.kts). Installed up front
      # with the same verify-and-retry as the NDK, rather than left to Gradle.
      - name: Install Android platform 37 (verified, with retry)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            if "$SDKMANAGER" --install "platforms;android-37" \
               && test -f "$ANDROID_HOME/platforms/android-37/android.jar"; then
              echo "Platform 37 installed on attempt $attempt"
              exit 0
            fi
            echo "Platform install attempt $attempt failed; removing partial install"
            rm -rf "$ANDROID_HOME/platforms/android-37"
            sleep 20
          done
          echo "Android platform 37 could not be installed after 4 attempts"
          exit 1
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: espanol-pro-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
