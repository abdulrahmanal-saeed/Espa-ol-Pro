name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, content, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/core/db/database.g.dart
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test tool test_screenshots
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Content validation
        run: dart run tool/validate_content.dart
      - name: Unit and widget tests
        run: flutter test
      - name: No secrets committed
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36})' -- . ':!pubspec.lock'; then
            echo "Possible secret found"; exit 1
          fi

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: espanol-pro-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
