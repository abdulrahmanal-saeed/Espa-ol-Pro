name: espanol_pro
description: "Español Pro — a private, offline-first Spanish academy for an Arabic-speaking professional."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  path_provider: ^2.1.6
  path: ^1.9.1
  fsrs: ^2.0.1
  flutter_tts: ^4.2.5
  file_picker: ^13.3.3
  sqlite3: ^3.9.1
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  test: ^1.32.0
flutter:
  uses-material-design: true
  assets:
    - assets/content/v1/
    - assets/content/v1/units/
    - assets/content/v1/dialogues/
    - assets/content/v1/assessments/
  fonts:
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/PlexArabic-400.ttf
          weight: 400
        - asset: assets/fonts/PlexArabic-500.ttf
          weight: 500
        - asset: assets/fonts/PlexArabic-600.ttf
          weight: 600
        - asset: assets/fonts/PlexArabic-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
